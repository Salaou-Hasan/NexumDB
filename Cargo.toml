[workspace]
resolver = "2"
members = [
    "crates/nexum-core",
    "crates/nexum-macros",
    "crates/nexum-table",
    "crates/nexum-tx",
    "crates/nexum-storage",
    "crates/nexum-wal",
    "crates/nexum-reducer",
    "crates/nexum-wasm",
    "crates/nexum-subscription",
    "crates/nexum-simulation",
    "crates/nexum-runtime",
    "crates/nexum-network",
    "crates/nexum-sdk",
    "crates/nexum-game-server",
    "crates/nexum-server",
    "crates/game-server",
    "crates/nexum-integration-tests",
    "crates/nexum-alloc-count",
    "benchmarks/nexum-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Salaou-Hasan/NexumDB"
homepage = "https://github.com/Salaou-Hasan/NexumDB"
description = "Nexum: an authoritative state engine for realtime multiplayer games and simulation backends. OCC transactions, WASM reducers, deterministic simulation, subscriptions, and a realtime protocol — all in Rust."
readme = "README.md"
keywords = ["game-engine", "multiplayer", "realtime", "database", "simulation", "wasm", "transactions"]
categories = ["game-development", "database-implementations", "wasm", "network-programming"]
exclude = ["target/", ".git/", "docs/", "benchmarks/", "tests/"]

[workspace.lints.rust]
unsafe_code = "allow"

# Phase 16 release profile (ADR-016 D5): fat LTO + single codegen unit
# maximize codegen quality with no correctness cost; panic=unwind keeps the
# catch_unwind-based failure isolation (a panicking reducer/WASM host never
# takes down the process). strip = "debuginfo" keeps symbols for crash
# reports while shrinking the binary.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

[workspace.dependencies]
nexum-macros = { path = "crates/nexum-macros" }
nexum-core = { path = "crates/nexum-core", version = "0.1.0" }
nexum-storage = { path = "crates/nexum-storage", version = "0.1.0" }
nexum-table = { path = "crates/nexum-table", version = "0.1.0" }
nexum-tx = { path = "crates/nexum-tx", version = "0.1.0" }
nexum-wal = { path = "crates/nexum-wal", version = "0.1.0" }
nexum-reducer = { path = "crates/nexum-reducer", version = "0.1.0" }
nexum-wasm = { path = "crates/nexum-wasm", version = "0.1.0" }
nexum-subscription = { path = "crates/nexum-subscription", version = "0.1.0" }
nexum-simulation = { path = "crates/nexum-simulation", version = "0.1.0" }
nexum-runtime = { path = "crates/nexum-runtime", version = "0.1.0" }
nexum-network = { path = "crates/nexum-network", version = "0.1.0" }
nexum-sdk = { path = "crates/nexum-sdk", version = "0.1.0" }
nexum-game-server = { path = "crates/nexum-game-server", version = "0.1.0" }
nexum-alloc-count = { path = "crates/nexum-alloc-count", version = "0.1.0" }
rayon = "1.10"

name: Bug Report
description: Report a bug in Nexum
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below so we can reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Clone the repository
        2. Run `cargo run -p game-server -- server`
        3. Connect a client
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
      placeholder: Describe what should have happened...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages, logs, or screenshots if applicable.
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of Nexum is affected?
      options:
        - Core types / state model
        - Table engine
        - Transaction engine (OCC)
        - Storage engine
        - WAL / snapshots / recovery
        - Reducer API
        - WASM reducer runtime
        - Subscription engine
        - Simulation engine
        - Runtime / partition orchestration
        - Networking / protocol
        - Client SDK
        - Game server layer
        - Benchmarking
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: Rust Version
      description: "Output of `rustc --version`"
      placeholder: "rustc 1.XX.0 (xxxxxxx 2026-XX-XX)"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: "Your OS and version"
      placeholder: "Windows 11 / macOS 15 / Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem (backtrace, config, etc.)
      placeholder: Add any additional context, logs, or screenshots here.
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I can reproduce this on the latest `main` branch
          required: true

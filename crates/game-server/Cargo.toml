[package]
name = "game-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Nexum: the actual playable multiplayer arena game built on the authoritative stack (server + terminal client)."

[dependencies]
nexum-core.workspace = true
nexum-macros = { path = "../nexum-macros" }
nexum-table.workspace = true
nexum-reducer.workspace = true
nexum-execution.workspace = true
nexum-tx.workspace = true
nexum-runtime.workspace = true
nexum-network.workspace = true
nexum-sdk.workspace = true
nexum-subscription.workspace = true
nexum-wasm.workspace = true
wat = "1.256"
ctrlc = "3.4"
rayon.workspace = true
nexum-alloc-count = { workspace = true, optional = true }

# Phase 26 OS tuning (--os-tune): timer resolution, priority, affinity.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Threading",
    "Win32_Media",
] }

[[bin]]
name = "game-server"
path = "src/bin/main.rs"

[features]
# Phase 21.5: installs a counting global allocator in the `ccu` example so
# the CCU harness can report allocations/tick and bytes/tick. Only used for
# dedicated allocation-profiling runs; the timing ladder runs without it so
# measurements are unperturbed.
ccu-alloc = ["dep:nexum-alloc-count"]

[lints]
workspace = true
